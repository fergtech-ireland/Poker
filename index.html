<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Texas Hold'em</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://lcekdvxhuimoxpiadism.supabase.co wss://lcekdvxhuimoxpiadism.supabase.co; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#1b1b1b">
  <meta name="description" content="Simple Texas Hold'em against the computer or with friends, with win/loss stats.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hold'em">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>Texas Hold'em</h1>
  <nav class="nav"><a href="./" class="active">vs Computer</a><a href="friends.html">With Friends</a></nav>

  <div class="stats">
    <div><span id="stat-played">0</span><small>Hands</small></div>
    <div><span id="stat-wins">0</span><small>Wins</small></div>
    <div><span id="stat-losses">0</span><small>Losses</small></div>
    <div><span id="stat-ties">0</span><small>Ties</small></div>
    <div><span id="stat-pct">0.0%</span><small>Win %</small></div>
  </div>

  <div class="table">
    <div class="seat">
      <div class="seat-info">
        Computer: <b id="cpu-chips">1000</b> chips<span class="tag" id="cpu-dealer" hidden>D</span>
        <span class="bet" id="cpu-bet"></span><span class="hand-name" id="cpu-hand-name"></span>
      </div>
      <div class="cards" id="cpu-cards"></div>
    </div>

    <div class="middle">
      <div class="pot">Pot: <b id="pot">0</b> <small id="street"></small></div>
      <div class="cards" id="board"></div>
    </div>

    <div class="seat">
      <div class="cards" id="your-cards"></div>
      <div class="seat-info">
        You: <b id="your-chips">1000</b> chips<span class="tag" id="your-dealer" hidden>D</span>
        <span class="bet" id="your-bet"></span><span class="hand-name" id="your-hand-name"></span>
      </div>
      <div class="equity-box"><span class="label">Win chance:</span><span class="equity" id="equity"></span></div>
    </div>
  </div>

  <div class="message" id="message"></div>

  <div class="controls">
    <button id="fold-btn">Fold</button>
    <button id="call-btn">Check</button>
    <button id="next-btn" hidden>Next Hand</button>
  </div>
  <div id="bet-panel"></div>

  <div class="log"><ul id="log"></ul></div>

  <div class="footer"><button id="reset-btn">Reset Stats</button></div>
  <footer class="colophon" data-release></footer>
</div>

<script src="version.js"></script>
<script src="betting.js"></script>
<script src="poker.js"></script>
<script src="game.js"></script>
<script src="sw-register.js"></script>
</body>
</html>
