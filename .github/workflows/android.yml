name: Build Android app

# Builds the Google Play app (a Trusted Web Activity that opens https://poker.fergtech.ie)
# from android/twa-manifest.json with Google's Bubblewrap tool.
# Run it from the Actions tab ("Run workflow"). Needs these repository secrets:
#   ANDROID_KEYSTORE_BASE64   the upload keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD its password
#   ANDROID_KEY_PASSWORD      the key's password (often the same)
# Before each Play release, bump appVersionCode (and appVersionName) in android/twa-manifest.json.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the signing secrets are set
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          [ -n "$KS" ]  || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"; missing=1; }
          [ -n "$KSP" ] || { echo "::error::Secret ANDROID_KEYSTORE_PASSWORD is not set"; missing=1; }
          [ -n "$KP" ]  || { echo "::error::Secret ANDROID_KEY_PASSWORD is not set"; missing=1; }
          exit $missing

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore the upload key
        working-directory: android
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Generate the Android project and build
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bubblewrap update --skipVersionUpgrade --manifest ./twa-manifest.json
          bubblewrap build --skipPwaValidation --manifest ./twa-manifest.json

      - name: Show the upload key fingerprint (for assetlinks.json)
        working-directory: android
        run: |
          keytool -list -v -keystore android.keystore -alias upload -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | grep -i "SHA256:" | tee fingerprint.txt
          rm -f android.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: holdem-android
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
            android/fingerprint.txt
          if-no-files-found: error
