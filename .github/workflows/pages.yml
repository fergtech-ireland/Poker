name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/texas-holdem-poker-game-hwf4kq]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html friends.html privacy.html delete-data.html sw-register.js version.js poker.js game.js friends.js config.js style.css sw.js manifest.webmanifest icons vendor CNAME .well-known _site/
          # Stamp the build commit and date into the release line
          sed -i "s/buildSha: ''/buildSha: '${GITHUB_SHA::7}'/; s/buildDate: ''/buildDate: '$(date -u +%F)'/" _site/version.js
          grep -q "buildSha: '${GITHUB_SHA::7}'" _site/version.js
          # Android app verification file and custom domain must be published
          test -f _site/.well-known/assetlinks.json
          test -f _site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
