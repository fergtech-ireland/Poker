name: Deploy to GitHub Pages

# The repo is private, and GitHub Pages needs a paid plan for private repos, so the site is hosted on
# Cloudflare Pages instead (see docs/PLAY_STORE_LISTING.md, step 1). This workflow is kept for running
# by hand if the repo goes public again or the account moves to GitHub Pro.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build site
        run: bash tools/build-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
