name: Deploy to GitHub Pages

# Publishes the site to GitHub Pages on every push (the repo is public). If the repo is made private,
# GitHub Pages stops working on the free plan; host on Cloudflare Pages instead (docs/PLAY_STORE_LISTING.md).
on:
  push:
    branches: [claude/texas-holdem-poker-game-hwf4kq]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build site
        run: bash tools/build-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
